<!doctype html>

<body>

<header class="site-header">
	<a class="brand" href="/">nburch.org</a>
	<nav class="nav">
		<a href="#work">work</a>
		<a href="#about">about</a>
		<a href="#contact">contact</a>
	</nav>

<main class="main">

	<section class="intro">
		<h1>Noah Burchell</h1>
		<p class="tagline"></p>
	</section>

	<section class="demo">
		<div class="demo-stage">
			<canvas id="cube" role="img" aria-label="A spinning platonic solid drawn in ASCII"></canvas>
		</div>

		<div class="demo-controls">
			<div class="shapes" id="shapes"></div>
			<button class="demo-toggle" id="toggle" type="button">pause</button>

		<p class="demo-caption">
			<a href="https://github.com/noahburchell/cube">cube</a> compiled to wasm
		</p>
		<p class="demo-error" id="demo-error" hidden></p>

	<section class="work" id="work">
		<h2>work</h2>
		<ul class="project-list">
			<li class="project">
				<h3 class="project-name">cube</h3>
				<p class="project-desc">spinning cube for your terminal, and the other platonic solids</p>

			</li>
		</ul>

	<section class="about" id="about">
		<h2>about</h2>
		<p></p>
